name: Deploy from Sheets

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PRIMARY_GOOGLE_API_KEY: ${{ secrets.VITE_PRIMARY_GOOGLE_API_KEY }}
          VITE_PRIMARY_SHEET_ID: ${{ secrets.VITE_PRIMARY_SHEET_ID }}
          VITE_FALLBACK_GOOGLE_API_KEY: ${{ secrets.VITE_FALLBACK_GOOGLE_API_KEY }}
          VITE_FALLBACK_SHEET_ID: ${{ secrets.VITE_FALLBACK_SHEET_ID }}
          VITE_SELLER_PASSWORD: ${{ secrets.VITE_SELLER_PASSWORD }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_SELLER_CACHE_DURATION_HOURS: ${{ secrets.VITE_SELLER_CACHE_DURATION_HOURS }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
